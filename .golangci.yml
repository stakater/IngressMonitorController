version: "2"

# golangci-lint v2 is required to lint a go 1.25 module (v1 was built with go 1.24
# and refuses to run on a newer go directive). The settings below keep the checks
# that were enabled by default in v1, so the migration does not turn on a new set
# of checks for existing code.
linters:
  settings:
    staticcheck:
      checks:
        - all
        # quickfix checks (QF*) are suggestions, they were not part of the v1
        # default linter set
        - -QF*
        # checks stylecheck skipped by default in v1
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
  exclusions:
    # the v1 `issues.exclude-use-default` defaults
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
